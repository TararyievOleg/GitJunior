<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Таблична форма реєстрації</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><main><nav><a href="index.html">Головна й анкета</a><a href="form1.html">Форма 1</a><a href="form2.html">Форма 2</a><a href="calculations.html">Розрахунки</a><a href="video.html">Відео</a><a href="audio.html">Аудіо</a><a href="report.html">Звіт</a></nav><h1>Таблична форма реєстрації</h1><p class="note">Елементи вирівняні таблицею відповідно до зразка. Дані залишаються у браузері.</p><form class="registration" action="#" method="post"><table><tbody><tr><td><label for="login">Логін</label></td><td><input id="login" name="login" required minlength="3" placeholder="Ваш логін" autocomplete="username"></td></tr><tr><td><label for="password">Пароль</label></td><td><input id="password" name="password" type="password" required minlength="6" placeholder="Щонайменше 6 символів" autocomplete="new-password"></td></tr><tr><td><label for="repeat">Повторіть пароль</label></td><td><input id="repeat" name="repeat" type="password" required minlength="6" placeholder="Повторіть пароль" autocomplete="new-password"></td></tr><tr><td>Стать</td><td class="choices"><label><input type="radio" name="gender" value="male" required> чоловік</label><label><input type="radio" name="gender" value="female"> жінка</label></td></tr><tr><td><label for="city">Вкажіть місто</label></td><td><select id="city" name="city" size="3" required><option selected>Житомир</option><option>Київ</option><option>Львів</option></select></td></tr><tr><td>Інтереси</td><td class="choices"><label><input type="checkbox" name="interests" value="football"> футбол</label><label><input type="checkbox" name="interests" value="chess"> шахи</label><label><input type="checkbox" name="interests" value="drawing"> малювання</label><label><input type="checkbox" name="interests" value="music"> музика</label></td></tr><tr><td></td><td><button type="reset">Очистити</button><button type="submit">Відправити</button></td></tr></tbody></table><p class="status" role="status" aria-live="polite"></p></form></main></body></html>
