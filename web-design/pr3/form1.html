<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Форма реєстрації користувача</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><main><nav><a href="index.html">Головна й анкета</a><a href="form1.html">Форма 1</a><a href="form2.html">Форма 2</a><a href="calculations.html">Розрахунки</a><a href="video.html">Відео</a><a href="audio.html">Аудіо</a><a href="report.html">Звіт</a></nav><h1>Форма реєстрації користувача</h1><p class="note">Навчальна форма: дані не передаються на сервер.</p><form class="registration" action="#" method="post"><div class="field"><label for="login">Логін</label><input id="login" name="login" type="text" required minlength="3" maxlength="40" placeholder="Ваш логін" autocomplete="username"></div>
<div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" required minlength="6" placeholder="Щонайменше 6 символів" autocomplete="new-password"></div>
<div class="field"><label for="repeat">Повторіть пароль</label><input id="repeat" name="repeat" type="password" required minlength="6" placeholder="Повторіть пароль" autocomplete="new-password"></div>
<div class="choices">Стать: <label><input type="radio" name="gender" value="male" required> чоловік</label><label><input type="radio" name="gender" value="female"> жінка</label></div><div class="field"><label for="country">Вкажіть країну</label><select id="country" name="country"><option value="ua" selected>Україна</option value="pl">Польща</option><option value="de">Німеччина</option></select></div><div class="field"><label for="about">Про себе</label><textarea id="about" name="about" rows="3" cols="35" placeholder="Я…"></textarea></div><button type="submit">Відправити</button><p class="status" role="status" aria-live="polite"></p></form></main></body></html>
